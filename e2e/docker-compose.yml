services:
  postgres:
    # Reuse the canonical debugger + pgTAP fixture instead of maintaining a
    # second image definition for integration tests.
    build:
      context: ../demo
    image: postgresql-workbench-postgres:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    volumes:
      - ./init/01-extension.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
      - ../demo/init/02-fibonacci.sql:/docker-entrypoint-initdb.d/02-fibonacci.sql:ro
      - ./init/02-test-functions.sql:/docker-entrypoint-initdb.d/03-test-functions.sql:ro
      - ./init/03-coverage.sql:/docker-entrypoint-initdb.d/04-coverage.sql:ro
      - ../demo/init/03-shop.sql:/docker-entrypoint-initdb.d/05-shop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 2s
      timeout: 5s
      retries: 10
