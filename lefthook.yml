pre-commit:
  piped: true
  jobs:
    - name: biome
      glob: "*.{ts,js,json}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
    - name: typecheck
      run: npx tsc --noEmit && npx tsc -p packages/views/tsconfig.json && npx tsc -p e2e/tsconfig.json && npm --prefix vscode-extension run compile
