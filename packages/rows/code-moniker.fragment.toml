fragment = "rows"
enabled = true

[aliases]
rows_package_source = "source ~ '**/dir:packages/dir:rows/**'"
rows_data_view_source = "source ~ '**/dir:packages/dir:rows/dir:src/dir:dataView/**'"
rows_data_view_target = "target ~ '**/dir:packages/dir:rows/dir:src/dir:dataView/**'"
rows_package_allowed = "target ~ '**/dir:packages/dir:rows/**' OR target ~ '**/dir:packages/dir:sql/**' OR target ~ '**/dir:packages/dir:dap/**'"

[[ts.refs.where]]
id = "package-depends-only-on-what-it-reads"
severity = "error"
expr = "$rows_package_source AND $architectural_dependency AND ($workbench_package_target OR $extension_local_target) => $rows_package_allowed"
message = "packages/rows reads and edits result rows: it depends on the SQL analysis layer and the DAP result shapes, and on nothing else."
rationale = "A result is produced by a query the SQL layer understands or by a debugged call the DAP layer captured. The catalog and the views consume rows; depending on either would close a cycle around the thing every result view renders."

[[ts.refs.where]]
id = "row-writes-are-assembled-in-one-place"
severity = "error"
expr = "kind = 'imports_symbol' AND target.segment('path') = 'buildRowUpdates' => $rows_package_source"
message = "Only packages/rows assembles the statements that write rows back to PostgreSQL."
rationale = "The Extension Host and the composition shell both hold changes and both apply them. The moment either builds its own UPDATE the two drift, and a reader gets a different guarantee depending on which surface they opened. Surfaces supply what they can do — a connection, a way to speak, a way to reload — and the write sequence stays here."

[[ts.refs.where]]
id = "data-view-protocol-has-one-home"
severity = "error"
expr = "kind = 'imports_symbol' AND (target.segment('path') = 'DataViewRequest' OR target.segment('path') = 'DataViewResponse' OR target.segment('path') = 'DataViewState') => target ~ '**/dir:packages/dir:rows/**'"
message = "The Data View protocol is the engine's: every host imports it from packages/rows and none declares its own."
rationale = "The protocol is what a host adapts to, so it cannot live in the view a host happens to render. It sat in packages/views, where the engine could not reach it, and the two hosts that speak it — the VS Code extension and the composition shell — each grew their own answer to twenty-six of its messages. A protocol with one home is what makes a second host an adapter instead of a second implementation."

[[ts.refs.where]]
id = "the-data-view-is-read-by-nothing-above-it"
severity = "error"
expr = "$rows_package_source AND NOT $rows_data_view_source AND $architectural_dependency AND target ~ '**/dir:packages/dir:rows/**' => NOT $rows_data_view_target"
message = "The Data View reads what every result surface offers; nothing above it reads back down into the Data View."
rationale = "Two thirds of this package is one feature, and it was indistinguishable from the rest until it was cut out. The cut is only worth something if it keeps one direction: the Data View reaches up for the cursor, the payload, navigation and the export writer, and the Scratchpad output and the debugger output never reach down for anything of the Data View's. That is also what makes promoting it to a package of its own a rename rather than an untangling."

[[ts.refs.where]]
id = "hidden-columns-are-answered-in-one-place"
severity = "error"
expr = "kind = 'imports_symbol' AND target.segment('path') = 'withRequiredColumnsRevealed' => source.segment('module') = 'hiddenColumns'"
message = "Which columns a Data View is not showing is answered by HiddenColumns, and by no host on its own."
rationale = "Both hosts kept their own list, their own technical keys and their own memory of what had been seen, and both worked out which ordinals to leave out by comparing bare column labels against a list that holds keys. A key names the table a column comes from, so it never equals a label: an export therefore wrote out the columns the reader had hidden, while the preview beside it — computed in the view, which does compare keys — left them out. One list, asked one way."

[[ts.refs.where]]
id = "what-a-data-view-is-is-said-in-one-place"
severity = "error"
expr = "kind = 'imports_symbol' AND target.segment('path') = 'DataViewQueryInfo' => source.segment('module') = 'dataViewState' OR source.segment('module') = 'dataViewProtocol'"
message = "A host says what its Data View is through dataViewState; it does not assemble the shape itself."
rationale = "Saying what a Data View currently is asks nothing, opens nothing and decides nothing — it is a plain reading of what the host already holds, and only two of its fields come from the host at all: the server's name and whether the query's editor has unsaved text. Both hosts wrote it out anyway, and had already drifted: one kept an empty message where the other dropped it. Nothing here ever needed a second author."
