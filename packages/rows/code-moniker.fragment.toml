fragment = "rows"
enabled = true

[aliases]
result_source = "source ~ '**/dir:packages/dir:rows/**'"
result_target = "target ~ '**/dir:packages/dir:rows/**'"
result_sql_analysis_debugger_target = "target ~ '**/dir:packages/dir:rows/**' OR target ~ '**/dir:packages/dir:sql/**' OR target ~ '**/dir:packages/dir:dap/**'"
result_row_write_target = "kind = 'imports_symbol' AND (target.segment('path') = 'buildRowUpdates' OR target.segment('path') = 'buildRowDeletes' OR target.segment('path') = 'buildRowInserts')"
data_view_source = "source ~ '**/dir:packages/dir:rows/dir:src/dir:dataView/**'"
data_view_target = "target ~ '**/dir:packages/dir:rows/dir:src/dir:dataView/**'"
data_view_protocol_target = "kind = 'imports_symbol' AND (target.segment('path') = 'DataViewRequest' OR target.segment('path') = 'DataViewResponse' OR target.segment('path') = 'DataViewState')"
data_view_hidden_columns_target = "kind = 'imports_symbol' AND target.segment('path') = 'withRequiredColumnsRevealed'"
data_view_hidden_columns_owner = "source.segment('module') = 'hiddenColumns'"
data_view_query_info_target = "kind = 'imports_symbol' AND target.segment('path') = 'DataViewQueryInfo'"
data_view_state_owner = "source.segment('module') = 'dataViewState' OR source.segment('module') = 'dataViewProtocol'"
data_view_edit_policy_target = "kind = 'imports_symbol' AND (target.segment('path') = 'READ_ONLY_REASONS' OR target.segment('path') = 'reasonAgainstWriting' OR target.segment('path') = 'dataViewWritableTable' OR target.segment('path') = 'describeDeleteConsequences')"
data_view_edit_policy_reader = "source ~ '**/dir:packages/dir:rows/dir:src/dir:dataView/**' OR source ~ '**/dir:packages/dir:views/**'"

[[ts.refs.where]]
id = "result-dependency-is-limited-to-sql-analysis-and-debugger"
severity = "error"
expr = "$result_source AND $structural_edge AND ($engine_package_target OR $host_local_target) => $result_sql_analysis_debugger_target"
message = "packages/rows reads and edits result rows: it depends on the SQL analysis layer and the DAP result shapes, and on nothing else."
rationale = "A result is produced by a query the SQL layer understands or by a debugged call the DAP layer captured. The catalog and the views consume rows; depending on either would close a cycle around the thing every result view renders."

[[ts.refs.where]]
id = "result-row-update-builder-encapsulation-stays-in-result-engine"
severity = "error"
expr = "$result_row_write_target => $result_source"
message = "Only packages/rows assembles the statements that write rows back to PostgreSQL."
rationale = "The Extension Host and the composition shell both hold changes and both apply them. The moment either builds its own UPDATE the two drift, and a reader gets a different guarantee depending on which surface they opened. Surfaces supply what they can do — a connection, a way to speak, a way to reload — and the write sequence stays here. The rule named the UPDATE alone for a year, because that was the statement it was written after; the DELETE and the INSERT beside it were guarded by nothing, and a host importing either would have passed. Three builders, one antecedent."

[[ts.refs.where]]
id = "data-view-result-protocol-ownership-stays-in-result-engine"
severity = "error"
expr = "$data_view_protocol_target => $result_target"
message = "The Data View protocol is the engine's: every host imports it from packages/rows and none declares its own."
rationale = "The protocol is what a host adapts to, so it cannot live in the view a host happens to render. It sat in packages/views, where the engine could not reach it, and the two hosts that speak it — the VS Code extension and the composition shell — each grew their own answer to twenty-six of its messages. A protocol with one home is what makes a second host an adapter instead of a second implementation."

[[ts.refs.where]]
id = "result-dependency-does-not-point-to-data-view"
severity = "error"
expr = "$result_source AND NOT $data_view_source AND $structural_edge AND $result_target => NOT $data_view_target"
message = "The Data View reads what every result surface offers; nothing above it reads back down into the Data View."
rationale = "Two thirds of this package is one feature, and it was indistinguishable from the rest until it was cut out. The cut is only worth something if it keeps one direction: the Data View reaches up for shared LIMIT/OFFSET paging, the payload, navigation and the export writer, and the Scratchpad output and the debugger output never reach down for anything of the Data View's. That is also what makes promoting it to a package of its own a rename rather than an untangling."

[[ts.refs.where]]
id = "data-view-hidden-column-ownership-stays-in-hidden-columns"
severity = "error"
expr = "$data_view_hidden_columns_target => $data_view_hidden_columns_owner"
message = "Which columns a Data View is not showing is answered by HiddenColumns, and by no host on its own."
rationale = "Both hosts kept their own list, their own technical keys and their own memory of what had been seen, and both worked out which ordinals to leave out by comparing bare column labels against a list that holds keys. A key names the table a column comes from, so it never equals a label: an export therefore wrote out the columns the reader had hidden, while the preview beside it — computed in the view, which does compare keys — left them out. One list, asked one way."

[[ts.refs.where]]
id = "data-view-query-info-ownership-stays-in-state-contract"
severity = "error"
expr = "$data_view_query_info_target => $data_view_state_owner"
message = "A host says what its Data View is through dataViewState; it does not assemble the shape itself."
rationale = "Saying what a Data View currently is asks nothing, opens nothing and decides nothing — it is a plain reading of what the host already holds, and only two of its fields come from the host at all: the Connection's name and whether the query's editor has unsaved text. Both hosts wrote it out anyway, and had already drifted: one kept an empty message where the other dropped it. Nothing here ever needed a second author."

[[ts.refs.where]]
id = "data-view-edit-policy-ownership-stays-with-the-engine-and-the-grid"
severity = "error"
expr = "$data_view_edit_policy_target => $data_view_edit_policy_reader"
message = "Whether a cell may be written, and the sentence said when it may not, are the engine's answer: a host asks for it and does not compose one."
rationale = "Two things ask this question and they ask it for opposite reasons: the grid, to decide whether to open an editor on a cell, and the held changes, to decide whether to take one. They must agree word for word, because a reader who is refused twice must not be told two different things — and the wording is the whole of what they get. A host has no reason to ask at all: it opens the connection, says what happened and remembers the move, and every judgement about the change itself is made before it is handed one. The moment a host words its own refusal there are two policies, and only one of them is the one the write will actually enforce."
