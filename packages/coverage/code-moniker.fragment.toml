fragment = "coverage"
enabled = true

[aliases]
coverage_package_source = "source ~ '**/dir:packages/dir:coverage/**'"
coverage_package_allowed = "target ~ '**/dir:packages/dir:coverage/**' OR target ~ '**/dir:packages/dir:sql/**'"

[[ts.refs.where]]
id = "package-depends-only-on-what-it-reads"
severity = "error"
expr = "$coverage_package_source AND $architectural_dependency AND ($workbench_package_target OR $extension_local_target) => $coverage_package_allowed"
message = "packages/coverage instruments PL/pgSQL through the SQL analysis layer; it depends on that package and nothing else."
rationale = "Coverage maps executed lines back to source. It needs the syntax layer and nothing the Workbench builds on top of it."
