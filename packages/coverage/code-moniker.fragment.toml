fragment = "coverage"
enabled = true

[aliases]
coverage_source = "source ~ '**/dir:packages/dir:coverage/**'"
coverage_sql_analysis_target = "target ~ '**/dir:packages/dir:coverage/**' OR target ~ '**/dir:packages/dir:sql/**'"

[[ts.refs.where]]
id = "coverage-dependency-is-limited-to-sql-analysis"
severity = "error"
expr = "$coverage_source AND $structural_edge AND ($engine_package_target OR $host_local_target) => $coverage_sql_analysis_target"
message = "packages/coverage instruments PL/pgSQL through the SQL analysis layer; it depends on that package and nothing else."
rationale = "Coverage maps executed lines back to source. It needs the syntax layer and nothing the Workbench builds on top of it."
