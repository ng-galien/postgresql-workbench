fragment = "shell"
enabled = true

[aliases]
workbench_composition_root_source = "source ~ '**/dir:packages/dir:shell/**'"
workbench_engine_target = "target ~ '**/dir:packages/**'"
extension_host_target = "target ~ '**/dir:vscode-extension/dir:src/**'"

[[ts.refs.where]]
id = "workbench-composition-root-stays-independent-of-extension-host"
severity = "error"
expr = "$workbench_composition_root_source AND $structural_edge AND ($workbench_engine_target OR $extension_host_target) => $workbench_engine_target"
message = "packages/shell composes the other packages into a running application; it may read any of them, and must never reach the Extension Host."
rationale = "The shell is the Workbench's second shell, not a test harness: it opens PostgreSQL, starts Code Moniker, runs the SQL language server as a child process, and serves the same React views to a browser — the exact composition the Electron application will ship, with only the window around it changing. It sits above every package and below no one, so nothing imports it and it imports no host. A dependency on vscode-extension would be the one thing that makes it unable to run on its own — and a request it answers with less than the extension does is a capability the standalone application silently lacks."
