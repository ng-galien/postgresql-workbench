fragment = "catalog"
enabled = true

[aliases]
ddl_sync_core_source = "source.segment('module') = 'postgresDdlSync'"
ddl_sync_runtime_target = "target.segment('module') = 'localCodeMoniker' OR target.segment('module') = 'codeMonikerRuntime' OR target.segment('module') = 'postgresCatalog' OR target.segment('module') = 'postgresSourceProvider'"
catalog_source = "source ~ '**/dir:packages/dir:catalog/**'"
catalog_sql_analysis_target = "target ~ '**/dir:packages/dir:catalog/**' OR target ~ '**/dir:packages/dir:sql/**'"

[[ts.refs.where]]
id = "catalog-dependency-is-limited-to-sql-analysis"
severity = "error"
expr = "$catalog_source AND $structural_edge AND ($engine_package_target OR $host_local_target) => $catalog_sql_analysis_target"
message = "packages/catalog reads PostgreSQL and indexes its sources through the SQL analysis layer; it depends on that package and nothing else."
rationale = "The catalog answers what a database contains. Reading rows, measuring coverage, debugging and rendering are what consume that answer, so a dependency on them would invert the direction the Workbench Index is built in."

[[ts.refs.where]]
id = "ddl-sync-single-responsibility-excludes-runtime-orchestration"
severity = "error"
expr = "$ddl_sync_core_source AND $structural_edge => NOT $ddl_sync_runtime_target"
message = "postgresDdlSync must remain pure DDL SQL and notification reduction; runtime orchestration belongs outside it."
rationale = "The core DDL unit builds provisioning SQL, validates the support schema, and coalesces notifications. Catalog reads, Code Moniker publication, session lifecycle, and incremental source mutation are coordinated by postgresSourceProvider and the Extension Host controller."
