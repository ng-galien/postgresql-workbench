fragment = "sql"
enabled = true

[aliases]
artifact = "uri ~ '**/lang:ts/dir:packages/dir:sql/dir:src/**' OR uri ~ '**/lang:sql/dir:packages/dir:sql/dir:src/**'"
sql_dependency = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'uses_type' OR kind = 'calls' OR kind = 'method_call' OR kind = 'instantiates' OR kind = 'extends' OR kind = 'implements'"
language_server_feature_target = "target ~ '**/dir:packages/dir:sql/dir:src/dir:languageServer/dir:features/**'"
language_server_owner = "source ~ '**/dir:packages/dir:sql/dir:src/dir:languageServer/**' OR source ~ '**/dir:e2e/**'"
sql_query_source = "source ~ '**/dir:packages/dir:sql/dir:src/dir:query/**'"
language_server_target = "target ~ '**/dir:packages/dir:sql/dir:src/dir:languageServer/**'"

[[ts.refs.where]]
id = "language-server-features-stay-behind-the-server"
severity = "error"
expr = "$sql_dependency AND $language_server_feature_target => $language_server_owner"
message = "Completion and semantic tokens are what the SQL language server answers with; ask the server instead of importing them."
rationale = "The language server is the front door for editor features: a consumer reaches completion, semantic tokens and document context through its protocol, never by importing what it answers with. Anything needed outside that protocol is a worker of its own — `query` for rewriting SQL, `text` for SQL as text — and is called directly and visibly. Tests may look behind the door."

[[ts.refs.where]]
id = "query-engine-does-not-depend-on-the-language-server"
severity = "error"
expr = "$sql_query_source AND $sql_dependency => NOT $language_server_target"
message = "The SQL query engine is a worker the Data View drives directly; it must not depend on the language server."
rationale = "Composition, join planning and query analysis are called by the server and, outside it, by the Data View and the row engine. Depending on the server would make the worker unusable without a language client and hide which side owns a rewrite."
