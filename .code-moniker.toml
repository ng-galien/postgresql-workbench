[[views.boundaries]]
id = "result-rows"
owns = [
  "the LIMIT/OFFSET paging contract every result surface reads rows through",
  "what a result is: its payload, its navigation, and writing it out",
  "the Data View, in src/dataView: its protocol, its query, its editability, its pending edits, and which of its columns are hidden",
]
forbids = [
  "depending on any package other than sql and dap",
  "VS Code, a webview, or the catalog",
  "reading, above the Data View, anything the Data View owns",
]
forbid_rules = [
  "ts.refs.rows.result-dependency-is-limited-to-sql-analysis-and-debugger",
  "result-dependency-does-not-point-to-data-view",
]
rationale = "A result comes from a query the SQL layer understands or a debugged call the DAP layer captured. The Scratchpad output and the Data View read rows through the same LIMIT/OFFSET contract; depending on the catalog or the views would close a cycle around the thing every result view renders. Two thirds of the package is the Data View, which is why it sits in a directory of its own: it reaches up for paging, the payload, navigation and the export writer, and nothing above it reaches down. What a host may not do is answer for the Data View itself — both of them held their own hidden columns, and both wrote out the ones the reader had hidden."
symbols = [
  "ts:packages/rows/src/offsetQuery.class:OffsetResultSession",
  "ts:packages/rows/src/dataView/hiddenColumns.class:HiddenColumns",
]
rules = [
  "ts.refs.rows.result-dependency-is-limited-to-sql-analysis-and-debugger",
  "result-dependency-does-not-point-to-data-view",
  "data-view-result-protocol-ownership-stays-in-result-engine",
  "data-view-hidden-column-ownership-stays-in-hidden-columns",
]

[[views.boundaries]]
id = "data-view-editing"
owns = [
  "what a change is: a cell edit, a row taken away, a row added — and the row identity all three are held against",
  "what may be written and why not: the column policy, the one table whole rows go to, what a deletion drags along",
  "what is waiting: the three lists, the one door every move goes through, and the way back to what was held before it",
  "how a change is written: the guarded UPDATE, the DELETE by identity, the INSERT of the columns filled in",
  "the single transaction the three are written in, and the ROLLBACK that leaves the database as it was",
]
forbids = [
  "a surface deciding whether a cell may be written, or wording the refusal itself",
  "a surface assembling a statement that writes a row",
  "a surface performing a move on the held changes other than by handing it to PendingEdits.move",
  "taking a change while the transaction that would carry it is in flight",
]
forbid_rules = [
  "data-view-edit-policy-ownership-stays-with-the-engine-and-the-grid",
  "result-row-update-builder-encapsulation-stays-in-result-engine",
]
rationale = """
The hot path. A reader changes a cell, takes rows away, adds one and fills it in, reads back the
list of what is waiting, and then writes all of it at once or throws all of it away. Nothing here
touches PostgreSQL until they say so, and when they do it is one transaction: every statement or
none, guarded against the row having moved under them since it was read.

The journey is four questions asked in one place each. `editability` says what may be written and
why not, and both the grid and the held changes ask it, so a reader who is refused is refused in
the same words wherever they meet it. `dataView` says what a change is and what each one will do,
in the reader's language, before they commit to it. `pendingEdits` holds the three lists and is the
one door every move goes through. `updates` turns them into SQL, and nothing else assembles a
statement that writes a row.

A surface brings what it holds and no judgement: what may be written, which columns it is showing,
a connection to write through, a way to say what happened, a way to tell whatever shows the changes,
and — where it has one — a way to remember the move so its own undo stack keeps step. A surface
speaks the same way whether a change is being held or written, so it says that once. Everything
else is decided before it is handed anything.

Measured against that, August 2026. Both surfaces answered all six moves themselves, and what was
true of one move was true of the others only by coincidence. It had already stopped being true: a
write in flight refused the cell edits, because that was the only move that asked. A row added
meanwhile was held, and then dropped without a word when the transaction that never carried it
cleared what was waiting — the reader was told their changes had been applied, and the row they had
just added was gone. One door, one guard, one refusal, one undo entry, and the six moves named
together as `DataViewMove`: a seventh is added here, and both surfaces route it untouched.
"""
symbols = [
  "ts:packages/rows/src/dataView/pendingEdits.class:PendingEdits",
  "ts:packages/rows/src/dataView/pendingEdits.type:DataViewMove",
  "ts:packages/rows/src/dataView/editability.function:reasonAgainstWriting",
  "ts:packages/rows/src/dataView/updates.function:buildRowUpdates",
]
rules = [
  "data-view-edit-policy-ownership-stays-with-the-engine-and-the-grid",
  "result-row-update-builder-encapsulation-stays-in-result-engine",
  "data-view-hidden-column-ownership-stays-in-hidden-columns",
]

