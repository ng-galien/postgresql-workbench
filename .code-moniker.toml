default_rules = true

[exclude]
uris = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/*.node-test.mjs",
]

[aliases]
typescript = "uri ~ 'lang:ts/**'"
code_moniker_syntax_factory = "kind = 'imports_symbol' AND target.segment('module') = 'codeMonikerSyntax' AND target.segment('path') = 'createCodeMonikerSyntaxParser'"
code_moniker_daemon_lifecycle = "kind = 'imports_symbol' AND target.segment('module') = 'localCodeMoniker' AND (target.segment('path') = 'connectLocalCodeMoniker' OR target.segment('path') = 'ensureLocalCodeMonikerWorkspace')"
syntax_provider_owner = "source.segment('module') = 'localCodeMonikerSyntax' OR source.segment('module') = 'indexController' OR source ~ '**/dir:packages/dir:shell/**' OR source ~ '**/dir:e2e/**' OR source.segment('module') = 'codeMonikerSyntax.test' OR source.segment('module') = 'localCodeMoniker.test'"
architectural_dependency = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'uses_type' OR kind = 'calls' OR kind = 'method_call' OR kind = 'instantiates' OR kind = 'extends' OR kind = 'implements'"
workbench_package_target = "target ~ '**/dir:packages/**'"
extension_local_target = "target ~ '**/dir:vscode-extension/dir:src/**'"

[profiles.smells]
enable = ["\\.smell-"]

[profiles.architecture]
enable = [
  "code-moniker-syntax-provider-owned-by-runtime-boundary",
  "extension-entry-is-not-a-service",
  "the-extension-does-not-re-export-the-engine",
  "postgres-ddl-sync-core-remains-pure",
  "connection-service-owned-by-connection-manager",
  "scratchpad-file-remains-passive",
  # declared by the package fragments
  "language-server-features-stay-behind-the-server",
  "query-engine-does-not-depend-on-the-language-server",
  "package-is-the-leaf-of-the-graph",
  "package-depends-only-on-what-it-reads",
  "shell-composes-and-is-composed-by-nothing",
  "row-writes-are-assembled-in-one-place",
  "data-view-protocol-has-one-home",
  "the-data-view-is-read-by-nothing-above-it",
  "hidden-columns-are-answered-in-one-place",
  "what-a-data-view-is-is-said-in-one-place",
]

[[views]]
id = "postgres-workbench-boundaries"
title = "PostgreSQL Workbench boundaries"
scope = "."
intent = "Review ownership and dependency direction before changing a package boundary, the extension's activation, PostgreSQL Connexions, the Workbench Index, the Cockpit, Scratchpads, or DDL synchronization."
summary = """
Six packages and one extension. packages/sql is the leaf: it reads SQL and PL/pgSQL and answers
editor questions through its language server. packages/catalog says what a database contains and
keeps the Workbench Index of it. packages/dap debugs PL/pgSQL. packages/rows reads and edits result
rows. packages/coverage maps executed lines back to source. packages/views renders what the others
produce, in a webview that is a separate runtime and reaches the host only through a typed protocol.

The Extension Host composes them: it owns activation, VS Code commands, the open Connexions, and the
controllers whose lifecycle outlives a command. No package depends on it, and each package's own
fragment states what it may depend on.
"""

[[views.boundaries]]
id = "sql-analysis"
owns = [
  "the Code Moniker syntax boundary for SQL and PL/pgSQL",
  "SQL as text: identifiers, lexing, formatting, document language",
  "the query engine: analysis, relations, composition, join planning",
  "the SQL authoring language server and its protocol",
]
forbids = [
  "depending on any other package, or on the Extension Host",
  "importing what the language server answers with, from outside the server",
  "the query engine depending on the language server",
  "secondary SQL or PL/pgSQL syntax providers",
]
forbid_rules = [
  "package-is-the-leaf-of-the-graph",
  "language-server-features-stay-behind-the-server",
  "query-engine-does-not-depend-on-the-language-server",
  "code-moniker-syntax-provider-owned-by-runtime-boundary",
]
rationale = "The language server is the front door for editor features; a consumer asks it rather than importing completion or semantic tokens. Anything needed outside that protocol is a worker called directly: `query` to rewrite SQL, `text` to read it as text. The package is a leaf because the standalone DAP executable ships it without VS Code."
symbols = [
  "ts:packages/sql/src/localCodeMonikerSyntax.class:StatelessCodeMonikerSyntaxRuntime",
  "ts:packages/sql/src/analysis/codeMonikerSyntax.function:createCodeMonikerSyntaxParser",
]
rules = [
  "package-is-the-leaf-of-the-graph",
  "language-server-features-stay-behind-the-server",
  "query-engine-does-not-depend-on-the-language-server",
]

[[views.boundaries]]
id = "catalog-and-index"
owns = [
  "reading the PostgreSQL catalog and projecting it into virtual SQL sources",
  "the Code Moniker session and the per-Connexion Workbench Index",
  "DDL support-schema provisioning SQL and notification reduction",
  "the DDL listener lifecycle and the incremental refresh it triggers",
]
forbids = [
  "depending on any package other than sql",
  "runtime orchestration inside the pure DDL core",
  "presentation or result-session state",
]
forbid_rules = [
  "package-depends-only-on-what-it-reads",
  "postgres-ddl-sync-core-remains-pure",
]
rationale = "The catalog answers what a database contains; rows, coverage, debugging and rendering consume that answer. postgresDdlSync builds SQL and coalesces notifications deterministically, while ddlSync owns LISTEN state and refresh coordination."
symbols = [
  "ts:packages/catalog/src/indexController.class:WorkbenchIndexController",
  "ts:packages/catalog/src/localCodeMoniker.class:LocalCodeMonikerSession",
  "ts:packages/catalog/src/ddlSync.class:WorkbenchDdlSyncController",
  "ts:packages/catalog/src/postgresCatalog.function:readPostgresCatalog",
  "ts:packages/catalog/src/postgresDdlSync.function:buildWorkbenchDdlProvisioningSql",
]
rules = ["package-depends-only-on-what-it-reads", "postgres-ddl-sync-core-remains-pure"]

[[views.boundaries]]
id = "debugger"
owns = [
  "the DAP session and the pldbgapi backend",
  "two-pass variable resolution",
  "exact preservation of client-owned source URIs, with a sourceReference fallback",
]
forbids = [
  "depending on any package other than sql",
  "workspace daemons, indexed sources, catalog projection, or DDL synchronization",
]
forbid_rules = ["package-depends-only-on-what-it-reads"]
rationale = "The VS Code adapter and the published standalone executable are two hosts over one library. Neither lets the debugger read or index the user's workspace; a Workbench host may supply canonical source URIs, which the DAP preserves exactly."
symbols = [
  "ts:packages/dap/src/debugger/session/PlpgsqlDebugSession.class:PlpgsqlDebugSession",
  "ts:packages/dap/src/debugger/session/sourceRegistry.function:clientSourceUris",
]
rules = ["package-depends-only-on-what-it-reads"]

[[views.boundaries]]
id = "result-rows"
owns = [
  "the bounded cursor every surface reads rows through",
  "what a result is: its payload, its navigation, and writing it out",
  "the Data View, in src/dataView: its protocol, its query, its editability, its pending edits, and which of its columns are hidden",
]
forbids = [
  "depending on any package other than sql and dap",
  "VS Code, a webview, or the catalog",
  "reading, above the Data View, anything the Data View owns",
]
forbid_rules = [
  "package-depends-only-on-what-it-reads",
  "the-data-view-is-read-by-nothing-above-it",
]
rationale = "A result comes from a query the SQL layer understands or a debugged call the DAP layer captured. The Scratchpad output, the Data View and the debugger output all read rows through the same cursor; depending on the catalog or the views would close a cycle around the thing every result view renders. Two thirds of the package is the Data View, which is why it sits in a directory of its own: it reaches up for the cursor, the payload, navigation and the export writer, and nothing above it reaches down. What a host may not do is answer for the Data View itself — both of them held their own hidden columns, and both wrote out the ones the reader had hidden."
symbols = [
  "ts:packages/rows/src/cursor.class:SqlResultSession",
  "ts:packages/rows/src/dataView/hiddenColumns.class:HiddenColumns",
]
rules = [
  "package-depends-only-on-what-it-reads",
  "the-data-view-is-read-by-nothing-above-it",
  "data-view-protocol-has-one-home",
  "hidden-columns-are-answered-in-one-place",
]

[[views.boundaries]]
id = "webview-rendering"
owns = [
  "the React result grid, its navigation, and the three views that nest it",
  "the Cockpit graph and its interaction state",
  "the shared PostgreSQL visual identities",
]
forbids = [
  "depending on the Extension Host",
  "depending on any package other than catalog, dap and rows",
  "PostgreSQL transport, Code Moniker sessions, or VS Code state",
  "declaring the protocol it speaks: the Data View's belongs to the engine",
]
forbid_rules = ["package-depends-only-on-what-it-reads"]
rationale = "A webview is a separate runtime. It renders values and posts messages; connections, sessions and command execution stay in the host and cross the boundary through the protocol each view declares."
symbols = [
  "ts:packages/views/src/cockpit/graph/store.interface:CockpitStore",
  "ts:packages/views/src/presentation.function:postgresVisual",
]
rules = ["package-depends-only-on-what-it-reads"]

[[views.boundaries]]
id = "activation"
owns = [
  "extension activation and disposal",
  "VS Code command registration",
  "construction and wiring of the long-lived controllers",
  "the public extension API",
]
forbids = [
  "being imported as a service locator by a product module",
  "owning feature persistence or semantic caches",
  "holding logic that does not adapt anything to VS Code",
]
forbid_rules = ["extension-entry-is-not-a-service"]
rationale = """
Activation chooses implementations and binds commands; feature state stays in the controller that
defines its lifecycle. The extension adapts the engine to VS Code and holds nothing else, because
the same engine is meant to run under a host that is not VS Code at all.

Measured debt against that, August 2026. Five modules that never mentioned VS Code — 731 lines —
moved to the packages their own imports named, and the package rules now keep them there. Two
remain with no home the package graph allows: debug/launchConfiguration needs the saved connections
and the SQL call parser together, and no package may depend on both catalog and sql;
scratchpad/notebookFile needs catalog, dap, rows and views at once. And the extension re-exports
package symbols from 39 of its modules, 56 times, which is what let engine code look like extension
code in the first place. None of these three is expressible as a reference rule today, so they are
named here instead of enforced.
"""
symbols = ["ts:vscode-extension/src/extension.interface:PlpgsqlExtensionApi"]
rules = ["extension-entry-is-not-a-service"]

[[views.boundaries]]
id = "connexions"
owns = [
  "saved server identities and their secrets",
  "the open Connexions and the events that announce them",
  "dedicated PostgreSQL client construction",
]
forbids = [
  "a feature building its own ConnectionService",
  "owning the semantic index or a result session",
]
forbid_rules = ["connection-service-owned-by-connection-manager"]
rationale = "ConnectionManager is the single live facade over PostgreSQL transport. A feature building its own ConnectionService would create a second lifecycle nothing reconnects or disposes."
symbols = [
  "ts:vscode-extension/src/connection/openConnections.class:ConnectionManager",
  "ts:vscode-extension/src/connection/connectPostgres.class:ConnectionService",
  "ts:vscode-extension/src/connection/savedConnections.class:ServerStore",
  "ts:packages/catalog/src/savedConnection.interface:ServerConfig",
]
rules = ["connection-service-owned-by-connection-manager"]

[[views.boundaries]]
id = "scratchpads"
owns = [
  "the Scratchpad file format and its Association value objects",
  "workspace persistence of Scratchpads",
  "dedicated execution connections and Transaction mode",
  "hosting the bounded result session a notebook cell renders",
]
forbids = [
  "connection or execution lifecycle inside the serialized file",
  "reusing the shared interactive client for notebook execution",
]
forbid_rules = ["scratchpad-file-remains-passive"]
rationale = "A Scratchpad opens before anything connects, so reading and writing one must not need a live Connexion. Execution, transactions and cursors belong to register, association and resultHost."
symbols = [
  "ts:vscode-extension/src/scratchpad/notebookFile.interface:SqlNotebookFile",
  "ts:vscode-extension/src/scratchpad/workspace.class:SqlNotebookWorkspace",
  "ts:vscode-extension/src/scratchpad/resultHost.class:SqlNotebookResultHost",
]
rules = ["scratchpad-file-remains-passive"]

[[views.boundaries]]
id = "tree-and-cockpit"
owns = [
  "the Workbench tree projection of index snapshots",
  "the Cockpit host: navigation, snapshot validation, and the webview panel",
  "selection synchronization between the tree and the graph",
]
forbids = [
  "PostgreSQL transport construction",
  "owning the Code Moniker session",
]
rationale = "Tree and Cockpit project what the index holds. The host validates context and performs actions; the webview renders and manipulates protocol values."
symbols = [
  "ts:vscode-extension/src/workbench/tree.class:WorkbenchTreeProvider",
  "ts:vscode-extension/src/cockpit/view.class:WorkbenchGraphView",
  "ts:vscode-extension/src/cockpit/treeSync.class:WorkbenchGraphTreeSync",
]

[[views.gotchas]]
id = "the-language-server-is-also-a-worker"
rationale = "The SQL language server is the front door for consumers, and at the same time a client of the Extension Host: it cannot parse. Code Moniker lives in the host, so the server sends `postgresql-workbench/syntax` back for every completion, every semantic token and every composition. Nothing in the directory layout shows this inversion; the protocol file does."
symbols = ["ts:packages/sql/src/languageServer/protocol.const:SQL_AUTHORING_SYNTAX_REQUEST"]
check = "code_moniker_rules uri=\"workspace\" action=\"run\" profile=\"architecture\" report=true limit=200"

[[views.gotchas]]
id = "a-rule-that-guards-nothing"
rationale = "Every boundary rule lives in the fragment of the package it constrains, and the workspace file keeps only the vocabulary that is general. A rule whose subject is renamed keeps passing while checking nothing, so `check --report` names any rule whose antecedent never matched, and each rule here was proved by planting a forbidden edge and watching it fire."
check = "code_moniker_rules uri=\"workspace\" action=\"run\" profile=\"architecture\" report=true limit=200"

[[views.gotchas]]
id = "lifecycle-concentration"
rationale = "All smell rules are blocking errors. WorkbenchIndexController and WorkbenchGraphView carry explicit technical debt: their snapshot-bound capability surfaces are not split yet."
symbols = [
  "ts:packages/catalog/src/indexController.class:WorkbenchIndexController",
  "ts:vscode-extension/src/cockpit/view.class:WorkbenchGraphView",
]
check = "code_moniker_rules uri=\"workspace\" action=\"run\" profile=\"smells\" report=true limit=200"

[[views.gotchas]]
id = "test-coverage-is-layered"
rationale = "Unit tests sit beside the code they cover and run under vitest. The e2e suites need a real PostgreSQL or a real Code Moniker parser; the VS Code suites need a real VS Code; the Playwright lanes drive it. A module with no unit callers is a layering fact, not evidence of no test."
check = "npm test && npm run test:e2e:run"

[[ts.function.where]]
id = "name-camelcase"
severity = "error"
expr = "$camel OR $ts_callback OR (moniker ~ '**/dir:packages/dir:views/**' AND name =~ ^[A-Z][A-Za-z0-9]*$)"
message = "Functions use camelCase; React components in the Workbench webview use PascalCase. Rename `{name}`."
rationale = "PascalCase is part of the React component contract and lets the hooks linter recognise stateful components. packages/views holds every React view, so the exemption stops exactly at that package."

[[ts.shape.annotation.where]]
id = "no-comment-inside-callable"
severity = "error"
expr = "parent.shape != 'callable'"
message = "Move this explanation into naming or extracted code, outside the function."
rationale = "Comments inside functions hide executable intent and can mask gaps in line coverage. Functions should remain understandable through their names, structure, and tests."

[[ts.function.where]]
id = "smell-long-callable"
severity = "error"
expr = "lines <= 300"
message = "This callable is unusually long; verify that it still represents one coherent responsibility."
rationale = "Callables above this emergency bound deserve review for a concrete ownership or control-flow seam. The generous threshold avoids encouraging artificial indirection; this remains a review signal, not an architectural boundary."

[[ts.method.where]]
id = "smell-long-callable"
severity = "error"
expr = "lines <= 300"
message = "This callable is unusually long; verify that it still represents one coherent responsibility."
rationale = "Callables above this emergency bound deserve review for a concrete ownership or control-flow seam. The generous threshold avoids encouraging artificial indirection; this remains a review signal, not an architectural boundary."

[[ts.constructor.where]]
id = "smell-long-callable"
severity = "error"
expr = "lines <= 300"
message = "This callable is unusually long; verify that it still represents one coherent responsibility."
rationale = "Callables above this emergency bound deserve review for a concrete ownership or control-flow seam. The generous threshold avoids encouraging artificial indirection; this remains a review signal, not an architectural boundary."

[[ts.function.where]]
id = "smell-long-parameter-list"
severity = "error"
expr = "count(param) <= 6"
message = "This callable has a long parameter list; check whether the parameters form a stable concept."
rationale = "Long parameter lists can reveal missing abstractions or excessive responsibility, but adapters and protocol handlers may legitimately need them."

[[ts.method.where]]
id = "smell-long-parameter-list"
severity = "error"
expr = "count(param) <= 6"
message = "This callable has a long parameter list; check whether the parameters form a stable concept."
rationale = "Long parameter lists can reveal missing abstractions or excessive responsibility, but adapters and protocol handlers may legitimately need them."

[[ts.constructor.where]]
id = "smell-long-parameter-list"
severity = "error"
expr = "count(param) <= 6"
message = "This callable has a long parameter list; check whether the parameters form a stable concept."
rationale = "Long parameter lists can reveal missing abstractions or excessive responsibility, but adapters and protocol handlers may legitimately need them."

[[ts.class.where]]
id = "smell-large-class"
severity = "error"
expr = "count(method) <= 20 AND count(field) <= 30"
message = "This class has a large surface; verify that its responsibilities remain cohesive."
rationale = "Large classes often accumulate unrelated responsibilities. The TypeScript class domain and its native method and field collections deliberately exclude interfaces and type declarations from this implementation-oriented signal."

[[ts.class.where]]
id = "smell-method-size-disharmony"
severity = "error"
expr = "lines <= 300 OR count(method) < 6 OR cv(method, lines) <= 1.0"
message = "Method sizes vary strongly inside this class; inspect whether one method carries disproportionate responsibility."
rationale = "A strong size imbalance can expose orchestration or domain logic concentrated in one method. Classes of at most 300 lines are excluded because their distributions are too small to make this signal useful."

[[ts.class.where]]
id = "smell-balanced-method-fanout"
severity = "error"
expr = "count(method) < 6 OR gini(method, fan_out(each)) <= 0.7"
message = "Outgoing dependencies are concentrated in a small part of this class."
rationale = "Concentrated fan-out can identify methods that coordinate too many collaborators. The TypeScript class domain deliberately excludes interfaces because signatures have no executable coordination to review; this remains only a navigation signal."

[[ts.refs.where]]
id = "code-moniker-syntax-provider-owned-by-runtime-boundary"
severity = "error"
expr = "($code_moniker_syntax_factory OR $code_moniker_daemon_lifecycle) => $syntax_provider_owner"
message = "Create the Code Moniker syntax provider only in the Workbench or DAP runtime boundary."
rationale = "Feature visitors receive SyntaxParser or narrower business ports; they never create clients, daemons, or parallel AST providers."
