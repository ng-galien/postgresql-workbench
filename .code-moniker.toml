[[views.boundaries]]
id = "activation"
owns = [
  "extension activation and disposal",
  "VS Code command registration",
  "construction and wiring of the long-lived controllers",
  "the public extension API",
]
forbids = [
  "being imported as a service locator by a product module",
  "owning feature persistence or semantic caches",
  "holding logic that does not adapt anything to VS Code",
  "registering a VS Code command anywhere but a module's registerCommands",
]
forbid_rules = ["extension-host-composition-root-is-not-a-service-locator"]
rationale = """
Activation chooses implementations and binds commands; feature state stays in the controller that
defines its lifecycle. The extension adapts the engine to VS Code and holds nothing else, because
the same engine is meant to run under a host that is not VS Code at all.

Measured against that, September 2026. The pure modules moved to the packages their own imports
named — the notebook file format seeded packages/scratchpad, debuggability joined the dap launch
contract, associations and the connection registry joined catalog, the coverage report shapes
joined coverage, graph navigation joined the views — and the package rules now keep each of them
there. The re-exports that made engine code look like extension code are gone, and a rule holds
that one.

What is left is named and guarded rather than enforced by a rule, because neither fact lives in
the reference graph. scripts/extension/check-extension-adapts.mjs lists each remaining file with
its reason: the adapters that are legitimately VS Code's — the DAP entry, the shared error line,
the theme projection, the webview transport and its API shim, the notebook renderer entry — and
two debts still awaiting a home: coverage/client leans on the ConnectionManager, and
debug/launchConfiguration needs the saved connections and the SQL call parser together while no
package may depend on both catalog and sql. The guard fails on a new one, and on an entry that
has started adapting something.

A command is registered in a module's registerCommands. No reference rule can hold that: `vscode`
is an ambient module, `registerCommand` has no indexed symbol, and a rule written against it reports
zero violations while twenty-five sit in front of it. The guard is
scripts/extension/check-command-registrars.mjs instead, in the same `npm run check` the commit hook
runs — it names the three files excused from the convention and the reason each is, and it fails
both on a registration anywhere else and on an excuse that has stopped registering anything.
"""
symbols = ["ts:vscode-extension/src/extension.interface:PlpgsqlExtensionApi"]
rules = ["extension-host-composition-root-is-not-a-service-locator"]

