default_rules = true

[rules.taxonomy]
patterns = [
  "composition-root",
  "dependency",
  "encapsulation",
  "hygiene",
  "lifecycle",
  "ownership",
  "single-responsibility",
]
components = [
  "catalog",
  "code",
  "connection",
  "coverage",
  "data-view",
  "daemon",
  "debugger",
  "ddl-sync",
  "editor",
  "extension-host",
  "language-server",
  "query-engine",
  "presentation",
  "result",
  "scratchpad",
  "sql-analysis",
  "syntax",
  "webview",
  "workbench",
]

# Test code is excluded by what it is, not only by how it is named: a Playwright page object and a
# VS Code runner config are scaffolding that no rule about the product has anything to say about.
# `e2e/` and `packages/shell/` stay in: both are named owners in the boundary aliases below, and
# a rule cannot allow a directory it no longer reads.
[exclude]
uris = [
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/*.node-test.mjs",
  "**/vscode-extension/tests/**",
]

[aliases]
typescript = "uri ~ 'lang:ts/**'"
syntax_factory = "kind = 'imports_symbol' AND target.segment('module') = 'codeMonikerSyntax' AND target.segment('path') = 'createCodeMonikerSyntaxParser'"
syntax_workbench_debugger_owner = "source.segment('module') = 'localCodeMonikerSyntax' OR source.segment('module') = 'indexController' OR source ~ '**/dir:packages/dir:shell/**' OR source ~ '**/dir:e2e/**' OR source.segment('module') = 'codeMonikerSyntax.test'"
workbench_daemon_lifecycle = "kind = 'imports_symbol' AND target.segment('module') = 'localCodeMoniker' AND (target.segment('path') = 'connectLocalCodeMoniker' OR target.segment('path') = 'ensureLocalCodeMonikerWorkspace')"
workbench_daemon_owner = "source.segment('module') = 'indexController' OR source ~ '**/dir:packages/dir:shell/**' OR source ~ '**/dir:e2e/**' OR source.segment('module') = 'localCodeMoniker.test'"
structural_edge = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'uses_type' OR kind = 'calls' OR kind = 'method_call' OR kind = 'instantiates' OR kind = 'extends' OR kind = 'implements'"
engine_package_target = "target ~ '**/dir:packages/**'"
host_local_target = "target ~ '**/dir:vscode-extension/dir:src/**'"
webview_symbol = "moniker ~ '**/dir:packages/dir:views/**'"

[profiles.smells]
enable = ["\\.code-single-responsibility-"]

[profiles.architecture]
enable = [
  "syntax-workbench-debugger-ownership-stays-at-runtime-boundaries",
  "workbench-daemon-lifecycle-stays-at-runtime-boundaries",
  "extension-host-composition-root-is-not-a-service-locator",
  "extension-host-workbench-encapsulation-does-not-re-export-engine",
  "connection-service-ownership-stays-with-connection-manager",
  # declared by the package fragments
  "ddl-sync-single-responsibility-excludes-runtime-orchestration",
  "scratchpad-single-responsibility-keeps-files-passive",
  "language-server-encapsulation-keeps-features-inside-server",
  "query-engine-dependency-does-not-point-to-language-server",
  "sql-analysis-dependency-stays-inside-sql-analysis",
  "catalog-dependency-is-limited-to-sql-analysis",
  "coverage-dependency-is-limited-to-sql-analysis",
  "debugger-dependency-is-limited-to-sql-analysis",
  "result-dependency-is-limited-to-sql-analysis-and-debugger",
  "presentation-dependency-is-leaf",
  "editor-dependency-is-limited-to-sql-analysis-and-presentation",
  "webview-dependency-is-limited-to-catalog-debugger-result-presentation-and-editor",
  "workbench-composition-root-stays-independent-of-extension-host",
  "result-row-update-builder-encapsulation-stays-in-result-engine",
  "data-view-result-protocol-ownership-stays-in-result-engine",
  "result-dependency-does-not-point-to-data-view",
  "data-view-hidden-column-ownership-stays-in-hidden-columns",
  "data-view-query-info-ownership-stays-in-state-contract",
  "data-view-edit-policy-ownership-stays-with-the-engine-and-the-grid",
  "syntax-grammar-vocabulary-encapsulation-stays-in-postgres-grammar",
  "scratchpad-depends-on-engine-only",
  "coverage-encapsulation-consumers-enter-through-the-index",
]

[[views]]
id = "postgres-workbench-boundaries"
title = "PostgreSQL Workbench boundaries"
scope = "."
intent = "Review ownership and dependency direction before changing a package boundary, the extension's activation, PostgreSQL Connections, the Workbench Index, the Cockpit, Scratchpads, or DDL synchronization."
summary = """
One engine, three shells. Eight packages are the engine: packages/sql is the syntax leaf — it reads SQL and
PL/pgSQL and answers editor questions through its language server. packages/catalog says what a
database contains and keeps the Workbench Index of it. packages/dap debugs PL/pgSQL. packages/rows
reads and edits result rows. packages/coverage maps executed lines back to source.
packages/presentation owns the host-neutral visual vocabulary and default theme. packages/editor
owns the host-neutral Monaco surface and connects it to the SQL authoring server through the
official Monaco language-client stack. packages/views
renders what the others produce — React views that reach whatever hosts them only through the typed
protocol each view declares, because the same views must run under three shells: a VS Code webview,
a plain web page served by packages/shell, and the Electron application that shell grows into.

A shell composes the engine and adapts it to one runtime; it adds no judgement of its own. The
VS Code extension is one shell — activation, commands, the open Connections, the long-lived
controllers. packages/shell is the second: it runs the same engine, the same language server as a
child process, and the same views in a browser, which is why it is the seed of the Electron
application rather than a test harness. No package depends on any shell.

Every language capability — grammar vocabulary, lexical tokens, semantic names, completion — flows
through the SQL authoring server and its one client. A view that reaches for a host API, or a shell
that answers a language question itself, breaks the target on two of the three shells at once.
Each shell reaches the server through a KNOWN LSP client, never a homemade one: the extension
through VS Code's own LanguageClient, and the web and Electron shells through Monaco — Monaco is
the editor of the shells that are not VS Code, driven by monaco-languageclient over a transport the
shell provides. What this project writes itself is host plumbing only: starting the server,
carrying the transport, answering the host-bound requests. The same rule holds for the virtual
sources: their scheme, addressing and content are the engine's (catalog), each shell serves them
into its own document system, and their language features come from the server like every other
document's.
"""

[[views.boundaries]]
id = "sql-analysis"
owns = [
  "the Code Moniker syntax boundary for SQL and PL/pgSQL",
  "the grammar's vocabulary: generated from the grammars Code Moniker runs, read through one module",
  "SQL as text: identifiers, lexing, formatting, document language",
  "the query engine: analysis, relations, composition, join planning",
  "the SQL authoring language server, its protocol, its one token legend, and the one client every surface asks it through",
  "what a PL/pgSQL routine body's own names are: its variables, its parameters, its declared types",
]
forbids = [
  "depending on any other package, or on the Extension Host",
  "importing what the language server answers with, from outside the server",
  "the query engine depending on the language server",
  "secondary SQL or PL/pgSQL syntax providers",
  "asking a host's own provider registry for what the server answers",
  "a question the server asks its host that only one host can answer",
]
forbid_rules = [
  "sql-analysis-dependency-stays-inside-sql-analysis",
  "language-server-encapsulation-keeps-features-inside-server",
  "query-engine-dependency-does-not-point-to-language-server",
  "syntax-workbench-debugger-ownership-stays-at-runtime-boundaries",
  "syntax-grammar-vocabulary-encapsulation-stays-in-postgres-grammar",
  "scratchpad-depends-on-engine-only",
  "coverage-encapsulation-consumers-enter-through-the-index",
]
rationale = """
The language server is the front door for editor features; a consumer asks it rather than importing
completion or semantic tokens. Anything needed outside that protocol is a worker called directly:
`query` to rewrite SQL, `text` to read it as text. The package is a leaf because the standalone DAP
executable ships it without VS Code.

There is one client, built on the protocol library the server itself is built on, and every surface
asks through it. A host supplies the two things that genuinely differ — how its documents reach the
server, and what carries the request — and VS Code's own language client satisfies that without
adaptation, which is the point: VS Code is one host of this server, not the condition for having
one. The composition shell runs the server as a child process over stdio, which is the shape a
standalone application takes.

Measured against that, August 2026. The Data View asked VS Code what to propose and how to colour.
VS Code answers with every provider registered for the language, so a second SQL extension installed
beside this one landed its proposals in a Workbench view wearing this one's vocabulary — and outside
VS Code there is no aggregator to ask at all. Colouring a PL/pgSQL body was worse: it existed only
inside a VS Code provider, and the server asked the Extension Host for it and relayed the answer, so
a body opened anywhere else was coloured by nobody and nothing said so.
"""
symbols = [
  "ts:packages/sql/src/localCodeMonikerSyntax.class:StatelessCodeMonikerSyntaxRuntime",
  "ts:packages/sql/src/analysis/codeMonikerSyntax.function:createCodeMonikerSyntaxParser",
  "ts:packages/sql/src/languageServer/client.function:createSqlAuthoringClient",
  "ts:packages/sql/src/routines/semanticTokens.function:plpgsqlSemanticTokens",
]
rules = [
  "sql-analysis-dependency-stays-inside-sql-analysis",
  "language-server-encapsulation-keeps-features-inside-server",
  "query-engine-dependency-does-not-point-to-language-server",
]

[[views.boundaries]]
id = "catalog-and-index"
owns = [
  "reading the PostgreSQL catalog and projecting it into virtual SQL sources",
  "the Code Moniker session and the per-Connection Workbench Index",
  "DDL support-schema provisioning SQL and notification reduction",
  "the DDL listener lifecycle and the incremental refresh it triggers",
]
forbids = [
  "depending on any package other than sql",
  "runtime orchestration inside the pure DDL core",
  "presentation or result-session state",
]
forbid_rules = [
  "ts.refs.catalog.catalog-dependency-is-limited-to-sql-analysis",
  "workbench-daemon-lifecycle-stays-at-runtime-boundaries",
]
rationale = "The catalog answers what a database contains; rows, coverage, debugging and rendering consume that answer. postgresDdlSync builds SQL and coalesces notifications deterministically, while ddlSync owns LISTEN state and refresh coordination. The virtual sources are the engine's: the code+moniker:// scheme, the resource index behind it and the canonical symbol addressing all live here, so a shell serves those documents into its own document system — VS Code through a content provider, Electron through its own — without owning what they say. VS Code is one integration modality; it governs nothing, and a virtual source only it can open is a regression against every other shell."
symbols = [
  "ts:packages/catalog/src/indexController.class:WorkbenchIndexController",
  "ts:packages/catalog/src/localCodeMoniker.class:LocalCodeMonikerSession",
  "ts:packages/catalog/src/ddlSync.class:WorkbenchDdlSyncController",
  "ts:packages/catalog/src/postgresCatalog.function:readPostgresCatalog",
  "ts:packages/catalog/src/postgresDdlSync.function:buildWorkbenchDdlProvisioningSql",
]
rules = ["ts.refs.catalog.catalog-dependency-is-limited-to-sql-analysis", "ddl-sync-single-responsibility-excludes-runtime-orchestration", "workbench-daemon-lifecycle-stays-at-runtime-boundaries"]

