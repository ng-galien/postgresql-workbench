name: Agent testimony from main

on:
  workflow_dispatch:
    inputs:
      testimony:
        description: Free testimony authored by the agent
        required: true
        type: string
      source_commit:
        description: Exact main commit this testimony refers to
        required: true
        type: string
      agent_name:
        description: Agent that authored the testimony
        required: true
        type: choice
        options:
          - Codex
          - Claude

jobs:
  testimony:
    name: Collect agent testimony from main
    uses: ng-galien/ng-galien.github.io/.github/workflows/collect-agent-testimony-main.yml@main
    with:
      app_id: ${{ vars.BLOG_APP_ID }}
      project_slug: postgresql-workbench
      project_label: PostgreSQL Workbench
      categories_json: '["Agents", "PostgreSQL Workbench"]'
      tags_json: '["agent-testimony", "postgresql-workbench"]'
      testimony: ${{ inputs.testimony }}
      source_commit: ${{ inputs.source_commit }}
      source_ref: main
      agent_name: ${{ inputs.agent_name }}
    secrets:
      app_private_key: ${{ secrets.BLOG_APP_PRIVATE_KEY }}
