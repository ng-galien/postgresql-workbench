name: Catalog Release

on:
  push:
    tags:
      - "catalog-v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate standalone catalog release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify release commit and tag
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          version="$(node -p "require('./packages/catalog/package.json').version")"
          test "${GITHUB_REF_NAME}" = "catalog-v${version}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm --prefix vscode-extension run stage:code-moniker
      - run: npm run check
      - run: npx vitest run packages/catalog
      - run: npm run test:catalog:package
      - name: Start PostgreSQL integration fixture
        run: npm run test:e2e:up
      - name: Run real PostgreSQL catalog and structural comparison tests
        run: npm run test:e2e:workbench
      - name: Stop PostgreSQL integration fixture
        if: always()
        run: npm run test:e2e:down

  package-smoke:
    name: Smoke npm catalog (Node.js ${{ matrix.node }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24.19.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:catalog:package

  package:
    name: Package standalone catalog
    needs:
      - validate
      - package-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - run: npm ci
      - name: Build npm tarball
        run: |
          mkdir -p artifacts
          npm pack ./packages/catalog --pack-destination artifacts
          cd artifacts
          sha256sum ng-galien-postgresql-catalog-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgresql-catalog-npm
          path: artifacts
          if-no-files-found: error

  publish:
    name: Publish standalone catalog to npm
    needs: package
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: postgresql-catalog-npm
          path: artifacts
      - name: Verify packaged artifact
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Attest npm package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/ng-galien-postgresql-catalog-*.tgz
      - name: Publish validated package to npm
        run: |
          tarball=(./artifacts/ng-galien-postgresql-catalog-*.tgz)
          package="$(node -p "require('./packages/catalog/package.json').name")"
          version="$(node -p "require('./packages/catalog/package.json').version")"
          local_integrity="$(node -e "const fs=require('node:fs');const c=require('node:crypto');process.stdout.write('sha512-'+c.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "${tarball[0]}")"
          published_integrity="$(npm view "${package}@${version}" dist.integrity 2>/dev/null || true)"
          if test -n "${published_integrity}"; then
            test "${published_integrity}" = "${local_integrity}"
            echo "${package}@${version} already matches the validated tarball"
          else
            npm publish "${tarball[0]}" --access public --provenance
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/catalog/package.json').version")"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              artifacts/ng-galien-postgresql-catalog-*.tgz \
              artifacts/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/ng-galien-postgresql-catalog-*.tgz \
              artifacts/SHA256SUMS \
              --verify-tag \
              --title "PostgreSQL Catalog ${version}" \
              --generate-notes
          fi
