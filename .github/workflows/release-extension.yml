name: Extension Release

on:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify release commit and tag
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          version="$(node -p "require('./vscode-extension/package.json').version")"
          test "${GITHUB_REF_NAME}" = "extension-v${version}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm --prefix vscode-extension run stage:code-moniker

      - run: npm run check
      - run: npm run typecheck
      - run: npm test

      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scrot xvfb

      - name: Start PostgreSQL integration fixture
        run: npm run test:e2e:up
      - name: DAP Integration
        run: npm run test:e2e:run
      - name: VS Code Technical
        run: xvfb-run -a npm --prefix vscode-extension test
      - name: Playwright
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          bash scripts/test/run-playwright-ci.sh test:acceptance
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-playwright-results
          path: vscode-extension/test-results/**
          if-no-files-found: ignore
      - name: Stop acceptance database fixture
        if: always()
        run: docker compose -f docker/demo/compose.yml down -v
      - name: VS Code Compatibility
        timeout-minutes: 3
        run: xvfb-run -a npm --prefix vscode-extension run test:min-vscode
      - name: Stop PostgreSQL integration fixture
        if: always()
        run: npm run test:e2e:down
      - name: Run EnterpriseDB pldebugger compatibility tests
        run: npm run test:e2e:legacy

  package-extension:
    name: Package extension (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    env:
      CODE_MONIKER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm --prefix vscode-extension run package
      - run: git diff --exit-code -- vscode-extension/THIRD_PARTY_NOTICES.md
      - name: Install Linux display server for VS Code smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Smoke-test extension activation and Code Moniker on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix vscode-extension run test:smoke
      - name: Smoke-test extension activation and Code Moniker
        if: runner.os != 'Linux'
        run: npm --prefix vscode-extension run test:smoke
      - name: Generate validated artifact checksum
        run: npm --prefix vscode-extension run checksum:package
      - name: Upload target VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketplace-vsix-${{ matrix.target }}
          path: |
            vscode-extension/postgresql-workbench-*-${{ matrix.target }}.vsix
            vscode-extension/postgresql-workbench-*-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error

  release:
    name: Create extension release
    needs:
      - validate
      - package-extension
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: marketplace-vsix-*
          path: vscode-extension
          merge-multiple: true
      - name: Verify complete platform set
        working-directory: vscode-extension
        run: |
          version="$(node -p "require('./package.json').version")"
          for target in linux-x64 darwin-arm64 darwin-x64 win32-x64; do
            test -f "postgresql-workbench-${version}-${target}.vsix"
            test -f "postgresql-workbench-${version}-${target}.vsix.sha256"
          done
      - name: Attest VSIX build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: vscode-extension/postgresql-workbench-*.vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./vscode-extension/package.json').version")"
          awk -v heading="## [" -v version="${version}" '
            index($0, heading version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' vscode-extension/CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            vscode-extension/postgresql-workbench-*.vsix \
            vscode-extension/postgresql-workbench-*.vsix.sha256 \
            --verify-tag \
            --title "PostgreSQL Workbench ${version}" \
            --notes-file /tmp/release-notes.md
      - name: Upload combined Marketplace artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketplace-vsix
          path: vscode-extension/postgresql-workbench-*.vsix
          if-no-files-found: error

  publish-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: release
    runs-on: ubuntu-24.04
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm --prefix vscode-extension ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marketplace-vsix
          path: vscode-extension
      - name: Publish validated platform VSIX files
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "${VSCE_PAT}"
          for vsix in postgresql-workbench-*.vsix; do
            npx --no-install vsce publish --skip-duplicate --packagePath "${vsix}"
          done
