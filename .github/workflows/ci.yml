name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npx tsc --noEmit
      - run: npm --prefix vscode-extension run compile

  architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      # The check runs the same code-moniker the extension ships, staged the same way.
      - run: npm --prefix vscode-extension run stage:code-moniker
      - run: npm run check:architecture

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm test

  dap-integration:
    name: DAP Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - run: npm ci
      - run: npm run build:dap
      - name: Start PostgreSQL integration fixture
        run: npm run test:e2e:up
      - name: Run DAP integration tests
        run: npm run test:e2e:run
        timeout-minutes: 20
      - name: Stop PostgreSQL integration fixture
        if: always()
        run: npm run test:e2e:down

  vscode-technical:
    name: VS Code Technical
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: xvfb-run -a npm --prefix vscode-extension test
        timeout-minutes: 15
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-technical-logs
          path: |
            vscode-extension/.vscode-test/user-data/logs/**
            vscode-extension/.vscode-test/user-data/**/*.log
            /home/runner/.config/Code/logs/**
          if-no-files-found: ignore

  vscode-compatibility:
    name: VS Code Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: xvfb-run -a npm --prefix vscode-extension run test:min-vscode
        timeout-minutes: 15

  legacy-compatibility:
    name: EnterpriseDB pldebugger Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm --prefix vscode-extension run stage:code-moniker
      - run: npm run test:e2e:legacy
        timeout-minutes: 25

  # The Data View driven in a real browser against the real PostgreSQL and the real parser, with no
  # VS Code and no Electron. Fifty-odd journeys in under a minute, where the Electron lanes below
  # cost minutes apiece — so this is where behaviour is proven, and those prove only that the
  # message crosses the wire.
  shell:
    name: Playwright Components
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - run: npm ci
      - name: Install the browser the lane drives
        run: npx playwright install --with-deps chromium
      - name: Start the demo database
        run: npm run shell:up
      - name: Run the component lane
        run: npm run test:shell
        timeout-minutes: 10
      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shell-results
          path: test-results/**
          if-no-files-found: ignore
      - name: Stop the demo database
        if: always()
        run: npm run shell:down

  workbench-bootstrap:
    name: Playwright Bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGWB_ACCEPTANCE_VSCODE_VERSION: "1.109.0"
      PGWB_PLAYWRIGHT_MINIMAL_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      # Xvfb ships with the runner image. scrot only takes the diagnostic screenshot of the whole
      # screen, and the runner script tolerates its absence, so a slow mirror never fails a lane.
      - name: Install the screenshot tool, if the mirror allows
        continue-on-error: true
        timeout-minutes: 2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends scrot
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - name: Probe VS Code and extension bootstrap
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          bash scripts/test/run-playwright-ci.sh test:bootstrap
        timeout-minutes: 15
      - name: Upload Playwright bootstrap evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-bootstrap-results
          path: vscode-extension/test-results/**
          if-no-files-found: ignore

  workbench-acceptance:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGWB_ACCEPTANCE_VSCODE_VERSION: "1.109.0"
      PGWB_PLAYWRIGHT_MINIMAL_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      # Xvfb ships with the runner image. scrot only takes the diagnostic screenshot of the whole
      # screen, and the runner script tolerates its absence, so a slow mirror never fails a lane.
      - name: Install the screenshot tool, if the mirror allows
        continue-on-error: true
        timeout-minutes: 2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends scrot
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - name: Run Playwright Core lane
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          bash scripts/test/run-playwright-ci.sh test:acceptance:core
        timeout-minutes: 20
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-core-results
          path: vscode-extension/test-results/**
          if-no-files-found: ignore
      - name: Stop acceptance database fixture
        if: always()
        run: docker compose -f docker/demo/compose.yml down -v

  workbench-index-lifecycle:
    name: Playwright Index lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGWB_ACCEPTANCE_VSCODE_VERSION: "1.109.0"
      PGWB_PLAYWRIGHT_MINIMAL_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      # Xvfb ships with the runner image. scrot only takes the diagnostic screenshot of the whole
      # screen, and the runner script tolerates its absence, so a slow mirror never fails a lane.
      - name: Install the screenshot tool, if the mirror allows
        continue-on-error: true
        timeout-minutes: 2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends scrot
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - name: Run Playwright Index lifecycle lane
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          bash scripts/test/run-playwright-ci.sh test:acceptance:index-lifecycle
        timeout-minutes: 15
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-index-lifecycle-results
          path: vscode-extension/test-results/**
          if-no-files-found: ignore
      - name: Stop acceptance database fixture
        if: always()
        run: docker compose -f docker/demo/compose.yml down -v

  workbench-schema-sync:
    name: Playwright Schema Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGWB_ACCEPTANCE_VSCODE_VERSION: "1.109.0"
      PGWB_PLAYWRIGHT_MINIMAL_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      # Xvfb ships with the runner image. scrot only takes the diagnostic screenshot of the whole
      # screen, and the runner script tolerates its absence, so a slow mirror never fails a lane.
      - name: Install the screenshot tool, if the mirror allows
        continue-on-error: true
        timeout-minutes: 2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends scrot
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - name: Run Playwright Schema Sync lane
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          bash scripts/test/run-playwright-ci.sh test:acceptance:schema-sync
        timeout-minutes: 15
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-schema-sync-results
          path: vscode-extension/test-results/**
          if-no-files-found: ignore
      - name: Stop acceptance database fixture
        if: always()
        run: docker compose -f docker/demo/compose.yml down -v

  package-dap:
    name: Smoke standalone DAP (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    env:
      CODE_MONIKER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:dap:package

  package-extension:
    name: Package extension (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    env:
      CODE_MONIKER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm --prefix vscode-extension run package
      - name: Require the packaged Code Moniker index to reach ready
        env:
          REQUIRE_LOCAL_CODE_MONIKER: "1"
        run: npm run test:code-moniker-runtime
        timeout-minutes: 3
      - run: git diff --exit-code -- vscode-extension/THIRD_PARTY_NOTICES.md
      - name: Smoke-test extension activation and Code Moniker on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a npm --prefix vscode-extension run test:smoke
      - name: Smoke-test extension activation and Code Moniker
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: npm --prefix vscode-extension run test:smoke
      - name: Generate validated artifact checksum
        run: npm --prefix vscode-extension run checksum:package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgresql-workbench-vsix-${{ matrix.target }}
          path: |
            vscode-extension/postgresql-workbench-*-${{ matrix.target }}.vsix
            vscode-extension/postgresql-workbench-*-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error
