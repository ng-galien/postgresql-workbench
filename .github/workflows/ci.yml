name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npx tsc --noEmit
      - run: npm --prefix vscode-extension run compile

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm test

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: sudo apt-get update
      - run: sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm run build
      - name: Start PostgreSQL integration fixture
        run: npm run test:e2e:up
      - name: Run DAP integration tests
        run: npm run test:e2e:run
      - name: Run VS Code extension integration tests
        run: xvfb-run -a npm --prefix vscode-extension test
      - name: Smoke-test extension on minimum supported VS Code
        timeout-minutes: 3
        run: xvfb-run -a npm --prefix vscode-extension run test:min-vscode
      - name: Upload VS Code test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-test-logs
          path: |
            vscode-extension/.vscode-test/user-data/logs/**
            vscode-extension/.vscode-test/user-data/**/*.log
            /home/runner/.config/Code/logs/**
          if-no-files-found: ignore
      - name: Stop PostgreSQL integration fixture
        if: always()
        run: npm run test:e2e:down

  legacy-compatibility:
    name: EnterpriseDB pldebugger Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm --prefix vscode-extension run stage:code-moniker
      - run: npm run test:e2e:legacy

  workbench-acceptance:
    name: Workbench Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: sudo apt-get update
      - run: sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - name: Run real Workbench UI journeys
        run: xvfb-run -a npm --prefix vscode-extension run test:acceptance
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workbench-acceptance-results
          path: vscode-extension/test-results/**
          if-no-files-found: ignore
      - name: Stop acceptance database fixture
        if: always()
        run: docker compose -f demo/docker-compose.yml down -v

  package-dap:
    name: Smoke standalone DAP (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    env:
      CODE_MONIKER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:dap:package

  package-extension:
    name: Package extension (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    env:
      CODE_MONIKER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm --prefix vscode-extension ci
      - run: npm --prefix vscode-extension run package
      - run: git diff --exit-code -- vscode-extension/THIRD_PARTY_NOTICES.md
      - name: Install Linux display server for VS Code smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Smoke-test extension activation and Code Moniker on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix vscode-extension run test:smoke
      - name: Smoke-test extension activation and Code Moniker
        if: runner.os != 'Linux'
        run: npm --prefix vscode-extension run test:smoke
      - name: Generate validated artifact checksum
        run: npm --prefix vscode-extension run checksum:package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgresql-workbench-vsix-${{ matrix.target }}
          path: |
            vscode-extension/postgresql-workbench-*-${{ matrix.target }}.vsix
            vscode-extension/postgresql-workbench-*-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error
