name: postgresql-workbench-legacy

services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/legacy/Dockerfile
      args:
        PG_MAJOR: "17"
        PLDEBUGGER_REF: ff0db437fc4e8dc75447e0e2fd792494249b05b4
    command: postgres -c shared_preload_libraries=plugin_debugger
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legacydb
    volumes:
      - ../../e2e/init/01-extension.sql:/docker-entrypoint-initdb.d/01-extension.sql:ro
      - ../../demo/init/02-fibonacci.sql:/docker-entrypoint-initdb.d/02-fibonacci.sql:ro
      - ../../e2e/init/02-test-functions.sql:/docker-entrypoint-initdb.d/03-test-functions.sql:ro
