<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#f7f9fa" />
    <meta property="og:title" content="{{title}} · PostgreSQL Workbench" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{canonicalUrl}}" />
    <meta property="og:image" content="https://ng-galien.github.io/postgresql-workbench/assets/cockpit.png" />
    <link rel="canonical" href="{{canonicalUrl}}" />
    <title>{{title}} · PostgreSQL Workbench</title>
    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="../styles.css" />
    <script src="../site.js" defer></script>
  </head>
  <body class="docs-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="PostgreSQL Workbench home">
        <img src="../assets/icon.png" alt="" width="40" height="40" />
        <span class="brand-name">PostgreSQL Workbench</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="index.html">Documentation</a>
        <a href="reference.html">Reference</a>
      </nav>
      <div class="header-tools">
        <a
          class="github-link"
          href="https://github.com/ng-galien/postgresql-workbench"
          aria-label="PostgreSQL Workbench on GitHub"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.98 10.98 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z" />
          </svg>
        </a>
        <a class="header-action" href="https://marketplace.visualstudio.com/items?itemName=ng-galien.postgresql-workbench">Install extension</a>
      </div>
    </header>

    <main id="main" class="docs-shell">
      <aside class="guide-nav" aria-label="Documentation guides">
        <div class="guide-nav-list">{{guideNavigation}}</div>
        <details class="guide-nav-menu">
          <summary>Browse documentation</summary>
          <nav aria-label="Documentation guides">{{guideNavigation}}</nav>
        </details>
      </aside>
      <article class="docs-article">
        {{breadcrumb}}
        {{eyebrowBlock}}
        {{content}}
      </article>
      <aside class="page-toc" aria-label="On this page">
        <p>On this page</p>
        {{tableOfContents}}
      </aside>
    </main>

    <footer>
      <p>PostgreSQL Workbench · {{title}}</p>
      <div class="footer-links"><a href="index.html">All guides</a><a href="https://github.com/ng-galien/postgresql-workbench/issues">Feedback</a></div>
    </footer>
  </body>
</html>
